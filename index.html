
<section id="v03-report" style="max-width:1180px;margin:18px auto;padding:0 16px">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px">
    <article class="card"><h3 data-i18n="coreTitle">核心人格模式</h3><div id="corePattern">输入生日后生成。</div></article>
    <article class="card"><h3 data-i18n="strengthTitle">优势倾向</h3><div id="strengthsV03">输入生日后生成。</div></article>
    <article class="card"><h3 data-i18n="tradeTitle">潜在代价</h3><div id="tradeoffsV03">输入生日后生成。</div></article>
    <article class="card"><h3 data-i18n="growthTitle">成长方向</h3><div id="growthV03">输入生日后生成。</div></article>
  </div>
  <article class="card" style="margin-top:14px">
    <h3>Initial Persona Code</h3>
    <div id="personaCodeV03">—</div>
    <p style="opacity:.68;font-size:12px;line-height:1.65">
      Initial Persona Code 是基于出生信息生成的探索性初始模型，不是确定的人格结论。
      未来将通过用户主动反馈、问卷与 AI 交流逐步验证和修正，形成 Living Profile。
    </p>
  </article>
</section>
<style>
#v03-report .card{border:1px solid rgba(50,177,255,.35);background:rgba(5,22,40,.82);border-radius:16px;padding:18px;color:#dff6ff}
#v03-report h3{margin:0 0 10px;color:#62d4ff}
input[type=date]{color-scheme:dark;cursor:pointer}
</style>
<script>
(function(){
 const names=["驱动力","竞争倾向","坚持","自主独立","开放探索","情感表达","社会使命","风险偏好","系统思维"];
 function updateV03(){
   const dateEl=document.querySelector('input[type="date"]');
   if(!dateEl || !dateEl.value) return;
   // Read existing visible nine-dimension scores where possible.
   const texts=[...document.querySelectorAll('.trait')].map(x=>x.innerText);
   let vals=texts.map(t=>{let m=t.match(/[-+]?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):0});
   if(vals.length<9){
     // Stable fallback only for display structure; existing engine remains authoritative.
     const seed=[...dateEl.value.replace(/\D/g,'')].reduce((a,b)=>a+Number(b),0);
     vals=names.map((_,i)=>Math.sin(seed*(i+1)*1.731)*1.45);
   }
   let ranked=vals.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
   let hi=ranked.slice(0,3).map(x=>names[x.i]);
   let low=ranked.slice(-2).map(x=>names[x.i]);
   document.getElementById('corePattern').textContent=`当前初始画像较突出的维度：${hi.join("、")}。`;
   document.getElementById('strengthsV03').textContent=`可能较容易表现为 ${hi.join("、")} 方面的优势；后续需要由真实经历和反馈验证。`;
   document.getElementById('tradeoffsV03').textContent=`优势过强时可能出现失衡；尤其要观察 ${hi[0]} 与 ${hi[1]} 是否在压力下带来额外负担。`;
   document.getElementById('growthV03').textContent=`优先通过真实反馈观察 ${low.join("、")} 与优势维度之间的平衡，而不是把出生模型当成固定标签。`;
   document.getElementById('personaCodeV03').textContent=dateEl.value.replaceAll("-","")+" · H9-"+vals.map(v=>Math.round((v+2)*25)).join(".");
 }
 const form=document.querySelector('form');
 if(form) form.addEventListener('submit',()=>setTimeout(updateV03,80));
})();
</script>

</body>
</html>
